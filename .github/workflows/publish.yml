name: Publish Traversal
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pypi-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Verify tag, version, ancestry and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          git merge-base --is-ancestor HEAD origin/main
          python -c 'import os,tomllib; assert "v"+tomllib.load(open("pyproject.toml","rb"))["project"]["version"] == os.environ["RELEASE_TAG"]'
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion --jq 'any(.[]; .conclusion == "success")' | grep -qx true
  wheels:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: 'v1.15.0'
          command: build
          args: --locked --release --out dist --interpreter ${{ runner.os == 'Linux' && format('python{0}', matrix.python) || 'python' }}
          manylinux: '2_28'
      - name: Test the release wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl pytest packaging
          python -m pytest
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
  sdist:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install maturin==1.15.0 twine
      - run: maturin sdist --out dist
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: source
          path: dist/*.tar.gz
  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/traversal/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.14.2
