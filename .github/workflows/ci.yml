name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked -p traversal-core
      - run: cargo clippy --locked -p traversal-core -- -D warnings
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.14t']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked --no-install-project --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync maturin build --locked --release --interpreter python --out dist
      - name: Install built wheel
        shell: bash
        run: uv pip install --reinstall --no-deps dist/*.whl
      - run: uv run --no-sync pytest
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          name: traversal-skill
          path: python/traversal/skills/
  source-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked --no-install-project
      - run: uv run --no-sync maturin sdist --out dist
      - run: uv pip install --reinstall dist/*.tar.gz
      - run: uv run --no-sync pytest
